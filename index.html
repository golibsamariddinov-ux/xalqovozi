<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>xalqovozi.com — Продаётся</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:  #0a0a0a;
      --card:   #181818;
      --gold:   #c8a84b;
      --gold2:  #e8c96a;
      --white:  #f0ece4;
      --red:    #9b2020;
      --muted:  #666;
      --border: #2a2a2a;
      --radius: 6px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      width: 100%;
    }

    /* ── HEADER ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: rgba(10,10,10,0.97);
    }

    .date-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--muted);
      font-weight: 300;
      text-transform: uppercase;
    }

    .lang-switcher { display: flex; gap: 5px; }
    .lang-switcher button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      padding: 6px 12px;
      cursor: pointer;
      border-radius: var(--radius);
      transition: all .2s;
      touch-action: manipulation;
    }
    .lang-switcher button.active { background: var(--gold); border-color: var(--gold); color: var(--black); }

    /* ── HERO ── */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 100px 24px 50px;
      min-height: 100svh;
      position: relative;
    }

    .hero-domain {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: clamp(26px, 8.5vw, 130px);
      line-height: 1.05;
      letter-spacing: -0.01em;
      margin-bottom: 24px;
      white-space: nowrap;
    }
    .hero-domain .www  { color: var(--gold); }
    .hero-domain .name { color: var(--white); }
    .hero-domain .dot  { color: var(--gold); }
    .hero-domain .ext  { color: var(--gold); }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--red);
      border: 1px solid rgba(255,255,255,0.08);
      color: #fff;
      padding: 11px 20px;
      border-radius: var(--radius);
      font-size: clamp(11px, 3.2vw, 13px);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 0;
      padding: 11px 18px;
    }
    .status-badge .label { color: rgba(255,255,255,0.55); font-weight: 400; }
    .status-badge .dot-pulse {
      width: 7px; height: 7px;
      background: #ff6b6b;
      border-radius: 50%;
      flex-shrink: 0;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.4; transform: scale(0.7); }
    }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 20px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }
    footer .foot-domain { font-family: 'Playfair Display', serif; font-size: 13px; color: var(--gold); }
    footer .foot-copy   { font-size: 11px; color: var(--muted); }

    /* ── TRANSLATIONS ── */
    [data-ru], [data-uz], [data-en] { display: none; }
    body.ru [data-ru] { display: inline; }
    body.uz [data-uz] { display: inline; }
    body.en [data-en] { display: inline; }

    /* ── DESKTOP ── */
    @media (min-width: 700px) {
      header { padding: 22px 60px; }

      .hero { padding: 130px 40px 90px; }
      .hero-domain {
        font-size: clamp(72px, 9vw, 130px);
        white-space: nowrap;
        margin-bottom: 36px;
      }
      .status-badge { font-size: 13px; padding: 14px 32px; gap: 14px; }

      footer { padding: 28px 60px; }
    }
  </style>
</head>
<body class="ru">

<!-- ── HEADER ── -->
<header>
  <span class="date-label">Xalq ovozi</span>
  <div class="lang-switcher">
    <button onclick="setLang('uz')" id="btn-uz">UZ</button>
    <button onclick="setLang('ru')" id="btn-ru" class="active">RU</button>
    <button onclick="setLang('en')" id="btn-en">EN</button>
  </div>
</header>

<!-- ── HERO ── -->
<section class="hero">
  <h1 class="hero-domain">
    <span class="www">www.</span><span class="name">xalqovozi</span><span class="dot">.</span><span class="ext">com</span>
  </h1>
  <div class="status-badge">
    <span class="label" data-ru>СТАТУС</span>
    <span class="label" data-uz>HOLAT</span>
    <span class="label" data-en>STATUS</span>
    <span data-ru>ПРОДАЁТСЯ</span>
    <span data-uz>SOTILADI</span>
    <span data-en>FOR SALE</span>
    <span class="dot-pulse"></span>
  </div>
</section>

<!-- ── FOOTER ── -->
<footer>
  <span class="foot-domain">www.xalqovozi.com</span>
  <span class="foot-copy">© 2026 · <span data-ru>Домен продаётся</span><span data-uz>Domen sotiladi</span><span data-en>Domain for sale</span></span>
</footer>

<script>
  function setLang(lang) {
    document.body.className = lang;
    document.getElementById('btn-uz').classList.toggle('active', lang === 'uz');
    document.getElementById('btn-ru').classList.toggle('active', lang === 'ru');
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  }
</script>
</body>
</html>
